name: release

# Publishing a GitHub release with a tag like v0.3.2 runs this workflow:
#   1. the full test suite on every platform,
#   2. the command-line binaries and Python wheels for every platform, each tested as installed,
#   3. a GitHub release with the binaries, PyPI with the wheels, and crates.io with the source.
#
# It can also be run by hand (Actions -> release -> Run workflow) for an existing tag:
# with both publish boxes unchecked it only builds and tests, as a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.3.1"
        required: true
      publish_pypi:
        description: "Publish the wheels to PyPI"
        type: boolean
        default: false
      publish_crates:
        description: "Publish the crate to crates.io"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  build:
    needs: tests
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest,   asset: macos-arm64,    wheel: macosx_11_0_arm64 }
          - { os: macos-15-intel, asset: macos-x86_64,   wheel: macosx_11_0_x86_64 }
          - { os: windows-latest, asset: windows-x86_64, wheel: win_amd64 }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Get the build script from this workflow's commit (an older tag may not have it)
        uses: actions/checkout@v4
        with:
          path: _ci
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test the release files
        run: bash _ci/.github/scripts/build_release.sh "$TAG" ${{ matrix.asset }} ${{ matrix.wheel }} python
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset }}
          path: dist/*

  # Linux is built in the manylinux_2_28 image (glibc 2.28), so the binary and wheel run on
  # most distributions from the last several years, not only on the build machine's.
  build-linux:
    needs: tests
    name: build linux-x86_64
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Get the build script from this workflow's commit (an older tag may not have it)
        uses: actions/checkout@v4
        with:
          path: _ci
          sparse-checkout: .github/scripts
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and test the release files
        run: bash _ci/.github/scripts/build_release.sh "$TAG" linux-x86_64 manylinux_2_28_x86_64 /opt/python/cp312-cp312/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/*

  github-release:
    if: github.event_name == 'push'
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the GitHub release (or add the files to it if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "wdelta $TAG" \
              --prerelease \
              --notes "Experimental release. The file format may change before 1.0.

          Prebuilt \`wdelta\` command-line codec and Python wheels for macOS (Apple Silicon and Intel), Windows x64 and Linux x64. All tests passed on every platform before these were built. Verify downloads against SHA256SUMS.txt."
          fi

  pypi:
    if: github.event_name == 'push' || inputs.publish_pypi
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: no stored password or token
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Keep only the wheels
        run: find dist -type f ! -name '*.whl' -delete && ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    if: github.event_name == 'push' || inputs.publish_crates
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write   # crates.io trusted publishing, once it is set up for the crate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      # The first publish of a new crate needs an API token (secret CARGO_REGISTRY_TOKEN);
      # after that, crates.io trusted publishing is used and the secret can be deleted.
      - name: Get a crates.io token
        id: token
        env:
          STORED: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$STORED" ]; then echo "stored=true" >> "$GITHUB_OUTPUT"; else echo "stored=false" >> "$GITHUB_OUTPUT"; fi
      - name: Trusted publishing login
        if: steps.token.outputs.stored == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
