[package]
name = "wdelta"
version = "0.3.1"
edition = "2024"
description = "Lossless delta compression for fine-tuned model weights (safetensors)"
license = "Apache-2.0"
repository = "https://github.com/endriasf/wdelta"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
zstd = "0.14.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
